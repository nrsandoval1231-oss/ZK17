name: Retrieve official playoff sources for review
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: playoff-source-review
  cancel-in-progress: false
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrieve allowlisted official documents without publishing results
        run: node scripts/retrieve-playoff-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-playoff-source-review
          path: artifacts/playoffs/retrieval/
          retention-days: 14
